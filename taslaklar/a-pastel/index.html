<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Taslak A – Pastel Çayır</title>
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #cfeaff; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="0.6" stop-color="#e3f1ff"/>
      <stop offset="1" stop-color="#ffe6f0"/>
    </linearGradient>
    <linearGradient id="tepeUzak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeec9"/>
      <stop offset="1" stop-color="#b6e2b8"/>
    </linearGradient>
    <linearGradient id="tepeYakin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e0a1"/>
      <stop offset="1" stop-color="#8fd48d"/>
    </linearGradient>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c6a8"/>
      <stop offset="1" stop-color="#d9ac8c"/>
    </linearGradient>
    <linearGradient id="cim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee48f"/>
      <stop offset="1" stop-color="#7fd474"/>
    </linearGradient>
    <radialGradient id="parilti" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gunes" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>

    <!-- Bulut -->
    <g id="bulut">
      <ellipse cx="0" cy="18" rx="78" ry="26" fill="#ffffff"/>
      <circle cx="-38" cy="6" r="30" fill="#ffffff"/>
      <circle cx="4" cy="-10" r="40" fill="#ffffff"/>
      <circle cx="44" cy="6" r="28" fill="#ffffff"/>
      <ellipse cx="0" cy="34" rx="70" ry="10" fill="#e6f0ff"/>
    </g>

    <!-- Yıldız (toplanabilir) -->
    <g id="yildiz">
      <circle r="38" fill="url(#parilti)"/>
      <path d="M0,-26 C3,-26 4,-23 6,-18 L10,-9 L20,-8 C26,-7 28,-4 25,0 L17,7 L20,17 C21,23 18,25 13,22 L0,15 L-13,22 C-18,25 -21,23 -20,17 L-17,7 L-25,0 C-28,-4 -26,-7 -20,-8 L-10,-9 L-6,-18 C-4,-23 -3,-26 0,-26 Z"
            fill="#ffd84d" stroke="#f2a93b" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="-6" cy="-8" rx="4" ry="6" fill="#fff6c9" transform="rotate(-25 -6 -8)"/>
      <circle cx="-5" cy="2" r="2.2" fill="#8a5a2b"/>
      <circle cx="5" cy="2" r="2.2" fill="#8a5a2b"/>
    </g>

    <!-- Çiçekler -->
    <g id="cicekPembe">
      <path d="M0,0 Q-2,14 0,26" stroke="#6cc46a" stroke-width="3" fill="none"/>
      <circle cx="0" cy="-7" r="6" fill="#ffb3cf"/>
      <circle cx="7" cy="0" r="6" fill="#ffb3cf"/>
      <circle cx="0" cy="7" r="6" fill="#ffb3cf"/>
      <circle cx="-7" cy="0" r="6" fill="#ffb3cf"/>
      <circle cx="0" cy="0" r="4.5" fill="#fff0a0"/>
    </g>
    <g id="cicekMor">
      <path d="M0,0 Q2,14 0,26" stroke="#6cc46a" stroke-width="3" fill="none"/>
      <circle cx="0" cy="-6" r="5" fill="#d6c2ff"/>
      <circle cx="6" cy="0" r="5" fill="#d6c2ff"/>
      <circle cx="0" cy="6" r="5" fill="#d6c2ff"/>
      <circle cx="-6" cy="0" r="5" fill="#d6c2ff"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
    <g id="cicekSari">
      <path d="M0,0 Q-1,12 0,22" stroke="#6cc46a" stroke-width="3" fill="none"/>
      <circle cx="0" cy="-5" r="4.5" fill="#fff1a8"/>
      <circle cx="5" cy="0" r="4.5" fill="#fff1a8"/>
      <circle cx="0" cy="5" r="4.5" fill="#fff1a8"/>
      <circle cx="-5" cy="0" r="4.5" fill="#fff1a8"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffb37a"/>
    </g>

    <!-- Kalp -->
    <path id="kalp" d="M0,14 C-4,10 -24,-2 -24,-14 C-24,-24 -16,-30 -9,-30 C-4,-30 -1,-27 0,-24 C1,-27 4,-30 9,-30 C16,-30 24,-24 24,-14 C24,-2 4,10 0,14 Z"/>

  <!-- GÖKYÜZÜ -->
  <rect width="1280" height="720" fill="url(#gok)"/>
  <circle cx="860" cy="120" r="100" fill="url(#gunes)"/>
  <circle cx="860" cy="120" r="46" fill="#fff0b3"/>

  <!-- Bulutlar -->
  <use href="#bulut" transform="translate(190 190) scale(1.0)" opacity="0.95"/>
  <use href="#bulut" transform="translate(560 140) scale(0.75)" opacity="0.9"/>
  <use href="#bulut" transform="translate(1080 220) scale(0.9)" opacity="0.92"/>
  <use href="#bulut" transform="translate(1210 290) scale(0.6)" opacity="0.85"/>

  <!-- Uzak tepeler -->
  <path d="M0,470 C120,380 260,380 380,450 C480,400 620,370 760,440 C880,390 1040,380 1160,440 C1210,420 1250,415 1280,420 L1280,720 L0,720 Z" fill="url(#tepeUzak)"/>

    <circle cx="301" cy="410" r="26" fill="#9bd69a"/>
    <rect x="980" y="408" width="10" height="34" rx="5" fill="#d2a985"/>

  <path d="M0,560 C140,500 280,500 420,545 C560,505 700,495 860,540 C1000,500 1140,500 1280,540 L1280,720 L0,720 Z" fill="url(#tepeYakin)"/>

  <!-- ZEMİN -->
  <g>
    <rect x="0" y="630" width="1280" height="90" fill="url(#zemin)"/>

    <rect x="0" y="600" width="1280" height="16" fill="#9ee48f"/>
    <!-- zemindeki taşlar -->
    <ellipse cx="140" cy="680" rx="16" ry="9" fill="#f3d6bd"/>
    <ellipse cx="470" cy="694" rx="12" ry="7" fill="#f3d6bd"/>
    <ellipse cx="760" cy="676" rx="18" ry="9" fill="#f3d6bd"/>
    <ellipse cx="1060" cy="698" rx="14" ry="7" fill="#f3d6bd"/>
  </g>

  <!-- Zemindeki çiçekler -->
  <use href="#cicekPembe" x="60" y="580"/>
  <use href="#cicekSari" x="96" y="586"/>
  <use href="#cicekMor" x="380" y="582"/>

  <use href="#cicekMor" x="1240" y="582"/>
  <!-- Çalılar -->
  <g fill="#86cf83">
    <circle cx="520" cy="598" r="22"/><circle cx="545" cy="590" r="26"/><circle cx="572" cy="600" r="20"/>
  </g>
  <circle cx="538" cy="584" r="5" fill="#ffb3cf"/><circle cx="560" cy="596" r="4" fill="#fff1a8"/>

  <!-- YÜZEN PLATFORMLAR -->
  <!-- Platform 1 -->
  <g transform="translate(300 470)">
    <ellipse cx="90" cy="64" rx="80" ry="10" fill="#7fb98b" opacity="0.35"/>
    <path d="M0,18 Q0,0 22,0 L158,0 Q180,0 180,18 Q180,40 150,48 Q90,62 30,48 Q0,40 0,18 Z" fill="#e7bfa0" stroke="#c99878" stroke-width="3"/>
    <rect x="-6" y="-8" width="192" height="26" rx="13" fill="#9ee48f" stroke="#6cc46a" stroke-width="3"/>
    <path d="M12,18 q8,10 16,0 q8,10 16,0 q8,10 16,0 q8,10 16,0 q8,10 16,0 q8,10 16,0 q8,10 16,0 q8,10 16,0 q8,10 16,0 q8,10 16,0" fill="#9ee48f"/>
    <circle cx="50" cy="34" r="5" fill="#f3d6bd"/><circle cx="120" cy="38" r="4" fill="#f3d6bd"/>
    <use href="#cicekPembe" x="150" y="-26" transform="scale(1)"/>
  </g>

  <!-- Platform 2 -->
  <g transform="translate(560 360)">
    <ellipse cx="100" cy="64" rx="86" ry="10" fill="#7fb98b" opacity="0.3"/>
    <path d="M0,18 Q0,0 22,0 L178,0 Q200,0 200,18 Q200,40 168,48 Q100,62 32,48 Q0,40 0,18 Z" fill="#e7bfa0" stroke="#c99878" stroke-width="3"/>

    <circle cx="60" cy="34" r="5" fill="#f3d6bd"/><circle cx="140" cy="36" r="4" fill="#f3d6bd"/>
    <use href="#cicekMor" x="22" y="-26"/>
    <use href="#cicekSari" x="180" y="-22"/>
  </g>

  <!-- Platform 3 -->
  <g transform="translate(860 440)">
    <ellipse cx="80" cy="60" rx="70" ry="9" fill="#7fb98b" opacity="0.3"/>

    <rect x="-6" y="-8" width="172" height="26" rx="13" fill="#9ee48f" stroke="#6cc46a" stroke-width="3"/>

    <circle cx="80" cy="34" r="5" fill="#f3d6bd"/>
    <use href="#cicekPembe" x="128" y="-26"/>

  <!-- YILDIZLAR -->
  <g>
    <use href="#yildiz" transform="translate(460 400)"/>
    <use href="#yildiz" transform="translate(620 290)"/>
    <use href="#yildiz" transform="translate(700 280)"/>
    <use href="#yildiz" transform="translate(940 370)"/>
    <use href="#yildiz" transform="translate(1040 540)"/>
    <!-- parıltı kıvılcımları -->
    <g fill="#ffffff">
      <path d="M660,240 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 z"/>
      <path d="M980,330 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 l6,-2 z"/>
      <path d="M500,355 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 l6,-2 z"/>
    </g>
  </g>

  <!-- BÖLÜM SONU BAYRAĞI -->
  <g transform="translate(1120 600)">
    <ellipse cx="0" cy="4" rx="34" ry="9" fill="#7fb98b" opacity="0.45"/>
    <rect x="-22" y="-14" width="44" height="18" rx="9" fill="#f3d6bd" stroke="#c99878" stroke-width="3"/>
    <rect x="-5" y="-210" width="10" height="200" rx="5" fill="#ffffff" stroke="#c9b6d9" stroke-width="3"/>
    <circle cx="0" cy="-216" r="12" fill="#ffd84d" stroke="#f2a93b" stroke-width="3"/>
    <path d="M5,-196 C40,-210 70,-180 108,-194 C100,-172 102,-152 110,-132 C72,-120 42,-148 5,-136 Z" fill="#ff9ec4" stroke="#e57aa6" stroke-width="3" stroke-linejoin="round"/>
    <!-- bayrakta yıldız -->
    <path d="M56,-178 l5,10 l11,1 l-8,7 l3,11 l-11,-6 l-10,6 l2,-11 l-8,-7 l11,-1 z" fill="#ffffff"/>
  </g>

  <!-- KARAKTER: Tavşan (platform 1 üzerinde, zıplamaya hazır) -->
  <g transform="translate(370 462)">
    <!-- gölge -->
    <ellipse cx="0" cy="0" rx="40" ry="8" fill="#6cc46a" opacity="0.6"/>
    <!-- kulaklar -->
    <g>
      <ellipse cx="-20" cy="-122" rx="14" ry="40" fill="#ffffff" stroke="#6b5a7a" stroke-width="4" transform="rotate(-12 -20 -122)"/>
      <ellipse cx="-20" cy="-120" rx="6" ry="28" fill="#ffc4d8" transform="rotate(-12 -20 -120)"/>
      <ellipse cx="22" cy="-124" rx="14" ry="40" fill="#ffffff" stroke="#6b5a7a" stroke-width="4" transform="rotate(14 22 -124)"/>
      <ellipse cx="22" cy="-122" rx="6" ry="28" fill="#ffc4d8" transform="rotate(14 22 -122)"/>
    </g>
    <!-- ayaklar -->
    <ellipse cx="-20" cy="-6" rx="18" ry="10" fill="#ffffff" stroke="#6b5a7a" stroke-width="4"/>
    <ellipse cx="22" cy="-6" rx="18" ry="10" fill="#ffffff" stroke="#6b5a7a" stroke-width="4"/>
    <!-- kuyruk -->
    <circle cx="-42" cy="-34" r="12" fill="#ffffff" stroke="#6b5a7a" stroke-width="4"/>
    <!-- gövde -->
    <ellipse cx="0" cy="-38" rx="38" ry="34" fill="#ffffff" stroke="#6b5a7a" stroke-width="4"/>
    <ellipse cx="2" cy="-32" rx="22" ry="20" fill="#ffe8f0"/>

    <circle cx="2" cy="-84" r="38" fill="#ffffff" stroke="#6b5a7a" stroke-width="4"/>

    <ellipse cx="-20" cy="-74" rx="9" ry="6" fill="#ffb3cf"/>
    <ellipse cx="26" cy="-74" rx="9" ry="6" fill="#ffb3cf"/>
    <!-- gözler -->
    <ellipse cx="-10" cy="-88" rx="6" ry="8" fill="#4a3b5c"/>
    <ellipse cx="16" cy="-88" rx="6" ry="8" fill="#4a3b5c"/>
    <circle cx="-8" cy="-91" r="2.5" fill="#ffffff"/>
    <circle cx="18" cy="-91" r="2.5" fill="#ffffff"/>

    <path d="M-4,-71 Q3,-65 3,-72 Q3,-65 10,-71" fill="none" stroke="#6b5a7a" stroke-width="2.5" stroke-linecap="round"/>

    <ellipse cx="-34" cy="-50" rx="9" ry="13" fill="#ffffff" stroke="#6b5a7a" stroke-width="4" transform="rotate(30 -34 -50)"/>
    <ellipse cx="38" cy="-56" rx="9" ry="13" fill="#ffffff" stroke="#6b5a7a" stroke-width="4" transform="rotate(-40 38 -56)"/>

  <!-- GÖSTERGE (HUD) -->
  <g>
    <!-- yıldız sayacı -->
    <g transform="translate(28 24)">
      <rect width="220" height="88" rx="44" fill="#ffffff" opacity="0.85" stroke="#f6c9dc" stroke-width="4"/>
      <g transform="translate(50 46) scale(1.35)">
        <path d="M0,-26 C3,-26 4,-23 6,-18 L10,-9 L20,-8 C26,-7 28,-4 25,0 L17,7 L20,17 C21,23 18,25 13,22 L0,15 L-13,22 C-18,25 -21,23 -20,17 L-17,7 L-25,0 C-28,-4 -26,-7 -20,-8 L-10,-9 L-6,-18 C-4,-23 -3,-26 0,-26 Z"
